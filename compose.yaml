services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: universus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/universus
      # Empty means a random key per start, so logins die on restart.
      UNIVERSUS_JWT_SECRET: ${UNIVERSUS_JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
